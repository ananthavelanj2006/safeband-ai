<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SafeBand AI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  min-height: 100vh;

  display: flex;

  justify-content: center;

  align-items: center;

  font-family: Arial, sans-serif;

  background: #111827;

  color: white;

  padding: 20px;
}

.card {

  width: 100%;

  max-width: 430px;

  background: #1f2937;

  padding: 30px;

  border-radius: 25px;

  text-align: center;
}

h1 {

  margin-bottom: 5px;
}

.subtitle {

  color: #d1d5db;

  margin-bottom: 25px;
}

input {

  width: 100%;

  padding: 14px;

  margin: 7px 0;

  border: none;

  border-radius: 10px;

  font-size: 16px;
}

button {

  cursor: pointer;
}

.primary {

  width: 100%;

  padding: 15px;

  margin-top: 12px;

  border: none;

  border-radius: 10px;

  background: #2563eb;

  color: white;

  font-size: 18px;

  font-weight: bold;
}

.secondary {

  margin-top: 15px;

  border: none;

  background: transparent;

  color: #60a5fa;

  font-size: 16px;
}

.message {

  margin-top: 15px;

  color: #fbbf24;

  line-height: 1.5;
}

#registerScreen,
#appScreen {

  display: none;
}

#userName {

  font-size: 28px;

  font-weight: bold;

  margin: 20px 0;
}

#status {

  font-size: 22px;

  margin: 20px;

  color: #22c55e;

  font-weight: bold;
}

#sos {

  width: 190px;

  height: 190px;

  border-radius: 50%;

  border: none;

  background: #dc2626;

  color: white;

  font-size: 30px;

  font-weight: bold;

  box-shadow: 0 0 35px rgba(220,38,38,.6);
}

#sos:active {

  transform: scale(.95);
}

.info {

  margin-top: 25px;

  background: #374151;

  padding: 20px;

  border-radius: 15px;

  line-height: 2;

  text-align: left;
}

.map {

  display: none;

  margin-top: 15px;

  padding: 12px;

  background: #2563eb;

  color: white;

  text-decoration: none;

  border-radius: 8px;

  text-align: center;
}

.contactButton {

  display: none;

  width: 100%;

  padding: 12px;

  margin-top: 10px;

  border: none;

  border-radius: 8px;

  color: white;

  font-size: 16px;

  text-decoration: none;

  text-align: center;
}

.sms {

  background: #16a34a;
}

.email {

  background: #7c3aed;
}

.logout {

  margin-top: 20px;

  background: #6b7280;

  color: white;

  border: none;

  padding: 10px 20px;

  border-radius: 8px;
}

</style>

</head>


<body>


<!-- LOGIN -->

<div class="card" id="loginScreen">

<h1>🛡️ SafeBand AI</h1>

<div class="subtitle">
Women Safety Emergency System
</div>

<input
type="email"
id="loginEmail"
placeholder="Email">

<input
type="password"
id="loginPassword"
placeholder="Password">

<button
class="primary"
onclick="login()">

🔐 LOGIN

</button>

<button
class="secondary"
onclick="showRegister()">

New user? Create Account

</button>

<div
id="loginMessage"
class="message">
</div>

</div>



<!-- REGISTER -->

<div class="card" id="registerScreen">

<h1>🛡️ SafeBand AI</h1>

<div class="subtitle">
Create your account
</div>

<input
id="regName"
placeholder="Your Name">

<input
type="email"
id="regEmail"
placeholder="Your Email">

<input
type="password"
id="regPassword"
placeholder="Create Password">

<input
id="parentName"
placeholder="Parent Name">

<input
id="parentPhone"
placeholder="Parent Phone Number">

<input
type="email"
id="parentEmail"
placeholder="Parent Email">

<button
class="primary"
onclick="register()">

✅ CREATE ACCOUNT

</button>

<button
class="secondary"
onclick="showLogin()">

Already have account? Login

</button>

<div
id="registerMessage"
class="message">
</div>

</div>



<!-- SOS APP -->

<div class="card" id="appScreen">

<h1>🛡️ SafeBand AI</h1>

<div id="userName">
Loading...
</div>

<div id="status">
🟢 SAFE
</div>

<button
id="sos"
onclick="sendSOS()">

🚨<br>SOS

</button>

<div class="info">

📅 Date:
<span id="date">---</span>

<br>

⏰ Time:
<span id="time">---</span>

<br>

📍 GPS:
<span id="gps">Waiting...</span>

<a
id="mapLink"
class="map"
target="_blank">

🗺️ Open Location

</a>

<a
id="smsLink"
class="contactButton sms">

📱 Send SMS to Parent

</a>

<a
id="emailLink"
class="contactButton email">

📧 Send Email to Parent

</a>

</div>

<button
class="logout"
onclick="logout()">

Logout

</button>

</div>



<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://frevekxhlarzhqupacyn.supabase.co";


const SUPABASE_KEY =
"sb_publishable_b48kPa-jjOBTpmtq5gv0BQ_37ZV6pC9";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);



/* =========================
   GLOBAL DATA
========================= */

let currentUser = null;

let currentStudent = null;

let parentContact = null;



/* =========================
   SCREEN FUNCTIONS
========================= */

function showLogin() {

  document.getElementById("loginScreen")
    .style.display = "block";

  document.getElementById("registerScreen")
    .style.display = "none";

  document.getElementById("appScreen")
    .style.display = "none";
}


function showRegister() {

  document.getElementById("loginScreen")
    .style.display = "none";

  document.getElementById("registerScreen")
    .style.display = "block";

  document.getElementById("appScreen")
    .style.display = "none";
}



/* =========================
   REGISTER
========================= */

async function register() {

  const name =
    document.getElementById("regName")
      .value.trim();

  const email =
    document.getElementById("regEmail")
      .value.trim();

  const password =
    document.getElementById("regPassword")
      .value;

  const parentName =
    document.getElementById("parentName")
      .value.trim();

  const parentPhone =
    document.getElementById("parentPhone")
      .value.trim();

  const parentEmail =
    document.getElementById("parentEmail")
      .value.trim();

  const message =
    document.getElementById("registerMessage");


  if (
    !name ||
    !email ||
    !password ||
    !parentName ||
    !parentPhone ||
    !parentEmail
  ) {

    message.innerText =
      "⚠️ எல்லா details-யும் fill பண்ணுங்க.";

    return;
  }


  if (password.length < 6) {

    message.innerText =
      "⚠️ Password minimum 6 characters.";

    return;
  }


  message.innerText =
    "Creating account...";


  /* Create Auth User */

  const {
    data: authData,
    error: authError
  } =
    await supabaseClient.auth.signUp({

      email: email,

      password: password

    });


  if (authError) {

    console.error(authError);

    message.innerText =
      "❌ " + authError.message;

    return;
  }


  const user =
    authData.user;


  if (!user) {

    message.innerText =
      "⚠️ Account created. Email confirmation தேவைப்படலாம்.";

    return;
  }


  /*
   * Save Student
   */

  const {
    data: student,
    error: studentError
  } =
    await supabaseClient

      .from("students")

      .insert({

        auth_user_id:
          user.id,

        name:
          name,

        parent_email:
          parentEmail,

        phone:
          parentPhone

      })

      .select()

      .single();


  if (studentError) {

    console.error(studentError);

    message.innerText =
      "❌ Student details save failed: "
      + studentError.message;

    return;
  }


  /*
   * Save Parent
   */

  const {
    error: contactError
  } =
    await supabaseClient

      .from("emergency_contacts")

      .insert({

        student_id:
          student.id,

        name:
          parentName,

        phone:
          parentPhone,

        email:
          parentEmail,

        relationship:
          "Parent"

      });


  if (contactError) {

    console.error(contactError);

    message.innerText =
      "❌ Parent details save failed: "
      + contactError.message;

    return;
  }


  message.innerText =
    "✅ Account created successfully!";


  setTimeout(() => {

    showLogin();

  }, 1500);

}



/* =========================
   LOGIN
========================= */

async function login() {

  const email =
    document.getElementById("loginEmail")
      .value.trim();

  const password =
    document.getElementById("loginPassword")
      .value;


  const message =
    document.getElementById("loginMessage");


  if (!email || !password) {

    message.innerText =
      "⚠️ Email and password enter pannunga.";

    return;
  }


  message.innerText =
    "Logging in...";


  const {
    data,
    error
  } =
    await supabaseClient.auth
      .signInWithPassword({

        email:
          email,

        password:
          password

      });


  if (error) {

    console.error(error);

    message.innerText =
      "❌ Invalid login credentials";

    return;
  }


  await showApp(data.user);

}



/* =========================
   SHOW APP
========================= */

async function showApp(user) {

  currentUser = user;


  document.getElementById("loginScreen")
    .style.display = "none";

  document.getElementById("registerScreen")
    .style.display = "none";

  document.getElementById("appScreen")
    .style.display = "block";


  /*
   * Get Logged-in User
   */

  const {
    data: student,
    error
  } =
    await supabaseClient

      .from("students")

      .select("*")

      .eq("auth_user_id", user.id)

      .maybeSingle();


  if (error) {

    console.error(error);

    document.getElementById("userName")
      .innerText = "User";

    return;
  }


  if (!student) {

    document.getElementById("userName")
      .innerText = "User";

    return;
  }


  currentStudent =
    student;


  document.getElementById("userName")
    .innerText =
      student.name;


  /*
   * Get Parent Contact
   */

  const {
    data: contact
  } =
    await supabaseClient

      .from("emergency_contacts")

      .select("*")

      .eq(
        "student_id",
        student.id
      )

      .limit(1)

      .maybeSingle();


  parentContact =
    contact;

}



/* =========================
   SOS
========================= */

async function sendSOS() {

  if (!currentStudent) {

    alert(
      "⚠️ User details not loaded."
    );

    return;
  }


  const status =
    document.getElementById("status");


  status.innerText =
    "🔴 EMERGENCY ACTIVE";

  status.style.color =
    "#ef4444";


  const now =
    new Date();


  const date =
    now.toISOString()
      .split("T")[0];


  const time =
    now.toTimeString()
      .split(" ")[0];


  document.getElementById("date")
    .innerText =
      date;


  document.getElementById("time")
    .innerText =
      time;


  if (!navigator.geolocation) {

    alert(
      "❌ GPS supported இல்லை."
    );

    return;
  }


  navigator.geolocation.getCurrentPosition(

    async function(position) {

      const latitude =
        position.coords.latitude;

      const longitude =
        position.coords.longitude;


      document.getElementById("gps")
        .innerText =
          latitude.toFixed(6)
          + ", "
          + longitude.toFixed(6);


      /*
       * Google Maps
       */

      const mapURL =
        "https://www.google.com/maps?q="
        + latitude
        + ","
        + longitude;


      const mapLink =
        document.getElementById("mapLink");


      mapLink.href =
        mapURL;


      mapLink.style.display =
        "block";


      /*
       * Save SOS
       */

      const {
        error
      } =
        await supabaseClient

          .from("emergency_alerts")

          .insert({

            student_id:
              currentStudent.id,

            latitude:
              latitude,

            longitude:
              longitude,

            emergency_date:
              date,

            emergency_time:
              time,

            status:
              "ACTIVE"

          });


      if (error) {

        console.error(error);

        alert(
          "❌ SOS database save failed: "
          + error.message
        );

        return;
      }


      /*
       * Parent SMS
       */

      if (parentContact) {

        const smsMessage =
          "🚨 SAFE BAND EMERGENCY!\n"
          + "Name: "
          + currentStudent.name
          + "\nDate: "
          + date
          + "\nTime: "
          + time
          + "\nLocation: "
          + mapURL;


        const smsLink =
          document.getElementById("smsLink");


        smsLink.href =
          "sms:"
          + parentContact.phone
          + "?body="
          + encodeURIComponent(
              smsMessage
            );


        smsLink.style.display =
          "block";


        /*
         * Parent Email
         */

        const emailMessage =
          "SAFE BAND EMERGENCY\n\n"
          + "Name: "
          + currentStudent.name
          + "\nDate: "
          + date
          + "\nTime: "
          + time
          + "\nGPS: "
          + latitude
          + ", "
          + longitude
          + "\n\nGoogle Maps:\n"
          + mapURL;


        const emailLink =
          document.getElementById("emailLink");


        emailLink.href =
          "mailto:"
          + parentContact.email
          + "?subject="
          + encodeURIComponent(
              "🚨 SafeBand Emergency Alert"
            )
          + "&body="
          + encodeURIComponent(
              emailMessage
            );


        emailLink.style.display =
          "block";
      }


      alert(
        "🚨 SOS SAVED SUCCESSFULLY!"
      );

    },


    function(error) {

      console.error(error);

      alert(
        "⚠️ Location permission Allow pannunga."
      );

    },


    {

      enableHighAccuracy:
        true,

      timeout:
        10000,

      maximumAge:
        0

    }

  );

}



/* =========================
   LOGOUT
========================= */

async function logout() {

  await supabaseClient.auth.signOut();

  currentUser = null;

  currentStudent = null;

  parentContact = null;

  showLogin();

}



/* =========================
   AUTO LOGIN
========================= */

async function checkLogin() {

  const {
    data
  } =
    await supabaseClient.auth
      .getSession();


  if (data.session) {

    await showApp(
      data.session.user
    );

  } else {

    showLogin();

  }

}


checkLogin();

</script>

</body>

</html>
