<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SafeBand AI</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial;
      background: #111827;
      color: white;
      text-align: center;
      padding: 30px;
    }

    .card {
      max-width: 450px;
      margin: auto;
      background: #1f2937;
      padding: 30px;
      border-radius: 25px;
    }

    #status {
      font-size: 22px;
      margin: 20px;
      color: #22c55e;
      font-weight: bold;
    }

    #sos {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      border: none;
      background: #dc2626;
      color: white;
      font-size: 30px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 35px #dc2626;
    }

    .info {
      margin-top: 25px;
      background: #374151;
      padding: 20px;
      border-radius: 15px;
      line-height: 2;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>🛡️ SafeBand AI</h1>

  <p>Women Safety Emergency System</p>

  <div id="status">🟢 SAFE</div>

  <button id="sos" onclick="sendSOS()">
    🚨<br>SOS
  </button>

  <div class="info">

    👤 Student: Student 01

    <br>

    📅 Date:
    <span id="date">---</span>

    <br>

    ⏰ Time:
    <span id="time">---</span>

    <br>

    📍 GPS:
    <span id="gps">Waiting...</span>

  </div>

</div>

<script>

const SUPABASE_URL = "frevekxhlarzhqupacyn";

const SUPABASE_KEY = "sb_publishable_b48kPa-jjOBTpmtq5gv0BQ_37ZV6pC9";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function sendSOS() {

  const status =
    document.getElementById("status");

  status.innerHTML =
    "🔴 EMERGENCY ACTIVE";

  status.style.color = "#ef4444";


  const now = new Date();

  const date =
    now.toISOString().split("T")[0];

  const time =
    now.toTimeString().split(" ")[0];


  document.getElementById("date")
    .innerText = date;

  document.getElementById("time")
    .innerText = time;


  if (!navigator.geolocation) {

    alert("GPS is not supported");

    return;

  }


  navigator.geolocation.getCurrentPosition(

    async function(position) {

      const latitude =
        position.coords.latitude;

      const longitude =
        position.coords.longitude;


      document.getElementById("gps")
        .innerText =
        latitude.toFixed(6) +
        ", " +
        longitude.toFixed(6);


      const { data, error } =
        await supabaseClient

        .from("emergency_alerts")

        .insert({

          student_id: 1,

          latitude: latitude,

          longitude: longitude,

          emergency_date: date,

          emergency_time: time,

          status: "ACTIVE"

        });


      if (error) {

        console.error(error);

        alert(
          "❌ SOS database save failed"
        );

      } else {

        alert(
          "🚨 SOS SAVED SUCCESSFULLY!"
        );

      }

    },

    function(error) {

      alert(
        "⚠️ Please allow GPS permission"
      );

    },

    {

      enableHighAccuracy: true,

      timeout: 10000,

      maximumAge: 0

    }

  );

}

</script>

</body>
</html>
