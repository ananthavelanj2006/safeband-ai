<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SafeBand AI</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #1f2937;
      padding: 30px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.35);
    }

    h1 {
      margin: 0 0 5px;
    }

    .subtitle {
      color: #d1d5db;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin: 7px 0;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    button {
      cursor: pointer;
    }

    .primary-btn {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    .secondary-btn {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #374151;
      color: white;
      font-size: 16px;
    }

    .link-btn {
      margin-top: 15px;
      border: none;
      background: transparent;
      color: #60a5fa;
      font-size: 16px;
    }

    .message {
      margin-top: 15px;
      line-height: 1.5;
      color: #fbbf24;
    }

    .error {
      color: #f87171;
    }

    .success {
      color: #4ade80;
    }

    #appScreen,
    #signupScreen {
      display: none;
    }

    #userName {
      font-size: 28px;
      font-weight: bold;
      margin: 20px 0;
    }

    #status {
      font-size: 22px;
      margin: 20px;
      color: #22c55e;
      font-weight: bold;
    }

    #sos {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      border: none;
      background: #dc2626;
      color: white;
      font-size: 30px;
      font-weight: bold;
      box-shadow: 0 0 35px rgba(220,38,38,0.65);
    }

    #sos:active {
      transform: scale(0.95);
    }

    .info {
      margin-top: 25px;
      background: #374151;
      padding: 20px;
      border-radius: 15px;
      line-height: 2;
      text-align: left;
    }

    .map {
      display: none;
      margin-top: 12px;
      padding: 12px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      text-align: center;
    }

    .sms {
      display: none;
      margin-top: 10px;
      padding: 12px;
      background: #16a34a;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      text-align: center;
    }

    .logout {
      margin-top: 20px;
      background: #6b7280;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
    }

    .small {
      color: #9ca3af;
      font-size: 13px;
      margin-top: 10px;
    }

  </style>

</head>

<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<div class="card" id="loginScreen">

  <h1>🛡️ SafeBand AI</h1>

  <div class="subtitle">
    Women Safety Emergency System
  </div>

  <input
    type="email"
    id="loginEmail"
    placeholder="Email"
  >

  <input
    type="password"
    id="loginPassword"
    placeholder="Password"
  >

  <button
    class="primary-btn"
    onclick="login()"
  >
    🔐 LOGIN
  </button>

  <button
    class="link-btn"
    onclick="showSignup()"
  >
    New user? Create Account
  </button>

  <div
    id="loginMessage"
    class="message"
  ></div>

</div>


<!-- =====================================================
     SIGNUP
===================================================== -->

<div class="card" id="signupScreen">

  <h1>🛡️ SafeBand AI</h1>

  <div class="subtitle">
    Create your account
  </div>

  <input
    type="text"
    id="signupName"
    placeholder="Your Name"
  >

  <input
    type="email"
    id="signupEmail"
    placeholder="Email"
  >

  <input
    type="password"
    id="signupPassword"
    placeholder="Password (minimum 6 characters)"
  >

  <input
    type="text"
    id="signupContactName"
    placeholder="Emergency Contact Name"
  >

  <input
    type="tel"
    id="signupContactPhone"
    placeholder="Emergency Contact Number"
  >

  <button
    class="primary-btn"
    onclick="createAccount()"
  >
    ✅ CREATE ACCOUNT
  </button>

  <button
    class="link-btn"
    onclick="showLogin()"
  >
    Already have an account? Login
  </button>

  <div
    id="signupMessage"
    class="message"
  ></div>

</div>


<!-- =====================================================
     SOS APP
===================================================== -->

<div class="card" id="appScreen">

  <h1>🛡️ SafeBand AI</h1>

  <div id="userName">
    Loading...
  </div>

  <div id="status">
    🟢 SAFE
  </div>

  <button
    id="sos"
    onclick="sendSOS()"
  >
    🚨
    <br>
    SOS
  </button>

  <div class="info">

    👤 Name:
    <span id="displayName">---</span>

    <br>

    📞 Emergency Contact:
    <span id="displayContact">---</span>

    <br>

    📅 Date:
    <span id="date">---</span>

    <br>

    ⏰ Time:
    <span id="time">---</span>

    <br>

    📍 GPS:
    <span id="gps">Waiting...</span>

    <a
      id="mapLink"
      class="map"
      href="#"
      target="_blank"
    >
      🗺️ Open Location
    </a>

    <a
      id="smsLink"
      class="sms"
      href="#"
    >
      📱 Send SOS Message
    </a>

  </div>

  <button
    class="logout"
    onclick="logout()"
  >
    Logout
  </button>

</div>


<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://frevekxhlarzhqupacyn.supabase.co";


/*
   IMPORTANT:
   Paste your SUPABASE PUBLISHABLE KEY here.
*/

const SUPABASE_KEY =
  "sb_publishable_b48kPa-jjOBTpmtq5gv0BQ_37ZV6pC9";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   SCREEN FUNCTIONS
===================================================== */

function showLogin() {

  document.getElementById("loginScreen")
    .style.display = "block";

  document.getElementById("signupScreen")
    .style.display = "none";

  document.getElementById("appScreen")
    .style.display = "none";
}


function showSignup() {

  document.getElementById("loginScreen")
    .style.display = "none";

  document.getElementById("signupScreen")
    .style.display = "block";

  document.getElementById("appScreen")
    .style.display = "none";
}


/* =====================================================
   CREATE ACCOUNT
===================================================== */

async function createAccount() {

  const name =
    document.getElementById("signupName")
      .value.trim();

  const email =
    document.getElementById("signupEmail")
      .value.trim();

  const password =
    document.getElementById("signupPassword")
      .value;

  const contactName =
    document.getElementById("signupContactName")
      .value.trim();

  const contactPhone =
    document.getElementById("signupContactPhone")
      .value.trim();

  const message =
    document.getElementById("signupMessage");


  message.className = "message";


  if (
    !name ||
    !email ||
    !password ||
    !contactName ||
    !contactPhone
  ) {

    message.innerText =
      "⚠️ எல்லா details-யும் fill பண்ணுங்க.";

    return;
  }


  if (password.length < 6) {

    message.innerText =
      "⚠️ Password minimum 6 characters இருக்க வேண்டும்.";

    return;
  }


  message.innerText =
    "Creating account...";


  try {

    /*
     * Supabase Auth account
     */

    const { data, error } =
      await supabaseClient.auth.signUp({

        email: email,

        password: password,

        options: {

          data: {

            name: name,

            contact_name: contactName,

            contact_phone: contactPhone

          }

        }

      });


    if (error) {

      console.error(error);

      message.className =
        "message error";

      message.innerText =
        "❌ " + error.message;

      return;
    }


    /*
     * If email confirmation is OFF,
     * session will be available.
     */

    if (data.session) {

      message.className =
        "message success";

      message.innerText =
        "✅ Account created!";

      setTimeout(function() {

        showApp(data.user);

      }, 500);

      return;
    }


    /*
     * If email confirmation is ON
     */

    message.className =
      "message success";

    message.innerText =
      "✅ Account created. Email verification complete pannitu Login pannunga.";

  }

  catch (err) {

    console.error(err);

    message.className =
      "message error";

    message.innerText =
      "❌ " + err.message;

  }

}


/* =====================================================
   LOGIN
===================================================== */

async function login() {

  const email =
    document.getElementById("loginEmail")
      .value.trim();

  const password =
    document.getElementById("loginPassword")
      .value;

  const message =
    document.getElementById("loginMessage");


  message.className =
    "message";


  if (!email || !password) {

    message.innerText =
      "⚠️ Email மற்றும் Password enter pannunga.";

    return;
  }


  message.innerText =
    "Logging in...";


  try {

    const { data, error } =
      await supabaseClient.auth
        .signInWithPassword({

          email: email,

          password: password

        });


    if (error) {

      console.error(error);

      message.className =
        "message error";

      /*
       * Show REAL Supabase error
       */

      message.innerText =
        "❌ " + error.message;

      return;
    }


    message.className =
      "message success";

    message.innerText =
      "✅ Login successful";


    await showApp(data.user);

  }

  catch (err) {

    console.error(err);

    message.className =
      "message error";

    message.innerText =
      "❌ " + err.message;

  }

}


/* =====================================================
   SHOW APP
===================================================== */

async function showApp(user) {

  document.getElementById("loginScreen")
    .style.display = "none";

  document.getElementById("signupScreen")
    .style.display = "none";

  document.getElementById("appScreen")
    .style.display = "block";


  /*
   * Get details from Supabase Auth metadata
   */

  const metadata =
    user.user_metadata || {};


  const name =
    metadata.name ||
    user.email ||
    "User";


  const contactName =
    metadata.contact_name ||
    "Emergency Contact";


  const contactPhone =
    metadata.contact_phone ||
    "";


  document.getElementById("userName")
    .innerText = name;


  document.getElementById("displayName")
    .innerText = name;


  if (contactPhone) {

    document.getElementById("displayContact")
      .innerText =
      contactName + " - " + contactPhone;

  } else {

    document.getElementById("displayContact")
      .innerText =
      "Not available";

  }


  /*
   * Save current user information
   */

  window.currentUser =
    user;

  window.currentUserId =
    user.id;

  window.contactPhone =
    contactPhone;

}


/* =====================================================
   SOS
===================================================== */

async function sendSOS() {

  const status =
    document.getElementById("status");


  status.innerText =
    "🔴 EMERGENCY ACTIVE";


  status.style.color =
    "#ef4444";


  const now =
    new Date();


  const date =
    now.toISOString()
      .split("T")[0];


  const time =
    now.toTimeString()
      .split(" ")[0];


  document.getElementById("date")
    .innerText = date;


  document.getElementById("time")
    .innerText = time;


  /*
   * GPS check
   */

  if (!navigator.geolocation) {

    alert(
      "❌ இந்த browser GPS support செய்யவில்லை."
    );

    return;
  }


  navigator.geolocation.getCurrentPosition(

    async function(position) {

      const latitude =
        position.coords.latitude;

      const longitude =
        position.coords.longitude;


      document.getElementById("gps")
        .innerText =
        latitude.toFixed(6)
        + ", "
        + longitude.toFixed(6);


      /*
       * Google Maps
       */

      const mapURL =
        "https://www.google.com/maps?q="
        + latitude
        + ","
        + longitude;


      const mapLink =
        document.getElementById("mapLink");


      mapLink.href =
        mapURL;


      mapLink.style.display =
        "block";


      /*
       * SOS message
       */

      const name =
        document.getElementById("displayName")
          .innerText;


      const message =
        "🚨 SOS EMERGENCY!\n"
        + "Name: "
        + name
        + "\n"
        + "Location: "
        + mapURL
        + "\n"
        + "Time: "
        + time;


      /*
       * SMS link
       */

      const phone =
        window.contactPhone;


      if (phone) {

        const smsURL =
          "sms:"
          + phone
          + "?body="
          + encodeURIComponent(message);


        const smsLink =
          document.getElementById("smsLink");


        smsLink.href =
          smsURL;


        smsLink.style.display =
          "block";

      }


      /*
       * Save SOS to Supabase
       *
       * This uses the existing
       * emergency_alerts table.
       */

      const { error } =
        await supabaseClient
          .from("emergency_alerts")
          .insert({

            /*
             * Existing table compatibility
             */

            student_id: 1,

            latitude:
              latitude,

            longitude:
              longitude,

            emergency_date:
              date,

            emergency_time:
              time,

            status:
              "ACTIVE"

          });


      if (error) {

        console.error(error);

        alert(
          "❌ SOS database save failed:\n"
          + error.message
        );

        return;
      }


      alert(
        "🚨 SOS SAVED SUCCESSFULLY!\n\n"
        + "Location captured."
      );

    },


    function(error) {

      console.error(error);

      let msg =
        "⚠️ Location permission allow pannunga.";

      if (error.code === 1) {

        msg =
          "⚠️ GPS permission denied.\n\n"
          + "Browser location permission Allow pannunga.";

      }

      if (error.code === 2) {

        msg =
          "⚠️ Location கிடைக்கவில்லை.";

      }

      if (error.code === 3) {

        msg =
          "⚠️ GPS timeout. மீண்டும் SOS press pannunga.";

      }

      alert(msg);

    },


    {

      enableHighAccuracy: true,

      timeout: 15000,

      maximumAge: 0

    }

  );

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout() {

  await supabaseClient.auth.signOut();

  window.currentUser = null;

  window.currentUserId = null;

  window.contactPhone = null;

  showLogin();

}


/* =====================================================
   CHECK EXISTING SESSION
===================================================== */

async function checkLogin() {

  try {

    const { data, error } =
      await supabaseClient.auth.getSession();


    if (error) {

      console.error(error);

      return;
    }


    if (data.session) {

      await showApp(
        data.session.user
      );

    } else {

      showLogin();

    }

  }

  catch (err) {

    console.error(err);

    showLogin();

  }

}


/* =====================================================
   START APP
===================================================== */

checkLogin();

</script>

</body>

</html>
